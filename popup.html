<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 350px;
      padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
    }
    h2 {
      margin-top: 0;
      color: #262626;
      font-size: 18px;
    }
    .section {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      font-size: 14px;
      color: #262626;
    }
    input[type="text"], textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #dbdbdb;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }
    textarea {
      height: 80px;
      resize: vertical;
      font-family: inherit;
    }
    button {
      background: #0095f6;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      width: 100%;
      margin-top: 10px;
    }
    button:hover {
      background: #1877f2;
    }
    .keywords-list {
      margin-top: 10px;
      max-height: 120px;
      overflow-y: auto;
      border: 1px solid #dbdbdb;
      border-radius: 4px;
      padding: 8px;
      background: #fafafa;
    }
    .keyword-tag {
      display: inline-block;
      background: #e0f1ff;
      padding: 4px 8px;
      margin: 2px;
      border-radius: 4px;
      font-size: 12px;
    }
    .remove-btn {
      margin-left: 5px;
      cursor: pointer;
      color: #ed4956;
      font-weight: bold;
    }
    .help-text {
      font-size: 12px;
      color: #8e8e8e;
      margin-top: 5px;
    }
    .stats {
      background: #f0f0f0;
      padding: 10px;
      border-radius: 4px;
      text-align: center;
      font-size: 13px;
      color: #262626;
    }
  </style>
</head>
<body>
  <h2>🛡️ Instagram Spoiler Filter</h2>
  
  <div class="section">
    <label>Add Show/Movie Keywords:</label>
    <input type="text" id="keywordInput" placeholder="e.g., Stranger Things, Eleven, Mind Flayer">
    <div class="help-text">Press Enter or click Add to save. Separate multiple with commas.</div>
    <button id="addBtn">Add Keywords</button>
  </div>

  <div class="section">
    <label>Your Blocked Keywords:</label>
    <div id="keywordsList" class="keywords-list">
      <span style="color: #8e8e8e;">No keywords added yet</span>
    </div>
  </div>

  <div class="section">
    <label>
      <input type="checkbox" id="checkComments"> Also scan comments for spoilers
    </label>
  </div>

  <div class="stats" id="stats">
    Posts filtered: 0
  </div>

  <script src="popup.js"></script>
</body>
</html>
